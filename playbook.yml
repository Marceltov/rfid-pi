---
# Sets up a Raspberry Pi with an RC522 RFID reader so `rfid` can read and
# write chips. Run: ansible-playbook playbook.yml
- name: RFID reader on a Raspberry Pi
  hosts: rfid
  become: true
  vars:
    # The GPIO the RC522's RST pin is wired to (header pin 22). The reader
    # sleeps while it is low, so the firmware drives it high from boot.
    rfid_rst_gpio: 25
    # The web page (rfid serve): http://<pi>:<port>/, no login, LAN only.
    rfid_web_port: 80
  tasks:
    - name: Check that this is Raspberry Pi OS (Bookworm or Trixie)
      ansible.builtin.assert:
        that: ansible_facts.distribution_release in ['bookworm', 'trixie']
        fail_msg: >-
          Expected Raspberry Pi OS Bookworm or Trixie, found
          {{ ansible_facts.distribution_release }}. The boot config lives in
          /boot/firmware/config.txt only from Bookworm on.

    - name: Install the SPI library for Python
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name: python3-spidev
        state: present
        install_recommends: false

    # Appended after the file's last section header; the block opens [all] so
    # it applies to every board whatever that header is.
    - name: Enable SPI and hold the reader's reset pin high
      ansible.builtin.blockinfile:
        path: /boot/firmware/config.txt
        marker: "# {mark} ANSIBLE MANAGED rfid reader"
        block: |
          [all]
          dtparam=spi=on
          gpio={{ rfid_rst_gpio }}=op,dh
      register: rfid_boot_config

    - name: Reboot so the boot config takes effect
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: rfid_boot_config is changed

    - name: Install the rfid command
      ansible.builtin.copy:
        src: files/rfid
        dest: /usr/local/bin/rfid
        mode: "0755"
      notify: Restart the web page

    # Reads the reader's version register over SPI: fails on a miswired or
    # unpowered reader, and needs no chip.
    - name: Check that the reader answers
      ansible.builtin.command: /usr/local/bin/rfid info
      register: rfid_info
      changed_when: false
      check_mode: false

    - name: Show the reader
      ansible.builtin.debug:
        msg: "{{ rfid_info.stdout }}"

    - name: Run the web page as a service
      ansible.builtin.copy:
        dest: /etc/systemd/system/rfid-web.service
        mode: "0644"
        content: |
          [Unit]
          Description=RFID reader web page (rfid serve)
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart=/usr/local/bin/rfid serve --port {{ rfid_web_port }}
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
      notify: Restart the web page

    - name: Start the web page at boot
      ansible.builtin.systemd_service:
        name: rfid-web
        enabled: true
        state: started
        daemon_reload: true

    - name: Restart the web page now if it changed
      ansible.builtin.meta: flush_handlers

    - name: Check that the web page answers and sees the reader
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ rfid_web_port }}/api/info"
      register: rfid_web_info
      retries: 10
      delay: 1
      until: rfid_web_info.status == 200
      check_mode: false

    - name: Show where the web page is
      ansible.builtin.debug:
        msg: "http://{{ ansible_host }}{{ '' if rfid_web_port == 80 else ':' ~ rfid_web_port }}/"

  handlers:
    - name: Restart the web page
      ansible.builtin.systemd_service:
        name: rfid-web
        state: restarted
        daemon_reload: true
